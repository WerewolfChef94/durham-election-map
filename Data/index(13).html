<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>County Durham — Election Results 2024</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #181c27;
      --border:    #2a2f40;
      --text:      #e8e6e0;
      --muted:     #7a8099;
      --accent:    #c8a96e;

      --reform:    #12b5b5;
      --labour:    #e4003b;
      --libdem:    #f5a623;
      --tory:      #003f8f;
      --green:     #4caf50;
      --indep:     #9e9e9e;
      --other:     #7b68ee;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 300;
    }

    /* ── Layout ── */
    #app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }

    /* ── Header ── */
    header {
      padding: 18px 28px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex-wrap: wrap;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1;
    }

    header h1 span {
      color: var(--accent);
    }

    .year-tag {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: var(--accent);
      color: #0f1117;
      padding: 3px 9px;
      border-radius: 2px;
    }

    .header-note {
      margin-left: auto;
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* ── Map container ── */
    #map-wrap {
      display: grid;
      grid-template-columns: 1fr 300px;
      height: 100%;
      overflow: hidden;
    }

    #map {
      background: #0d1020;
    }

    /* ── Sidebar ── */
    #sidebar {
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .sidebar-section {
      padding: 20px 20px 0;
    }

    .sidebar-section + .sidebar-section {
      border-top: 1px solid var(--border);
      margin-top: 20px;
      padding-top: 20px;
    }

    .section-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Legend ── */
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
      font-size: 0.82rem;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .legend-count {
      margin-left: auto;
      font-size: 0.72rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* ── Ward info panel ── */
    #ward-info {
      flex: 1;
      padding: 20px;
    }

    #ward-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      color: var(--muted);
      text-align: center;
      font-size: 0.82rem;
      padding: 30px;
    }

    #ward-placeholder svg {
      opacity: 0.2;
      margin-bottom: 4px;
    }

    #ward-detail { display: none; }

    .ward-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .ward-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .winner-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 3px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 18px;
      color: #fff;
    }

    /* ── Bar chart ── */
    .bar-row {
      margin-bottom: 10px;
    }

    .bar-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 3px;
    }

    .bar-party { color: var(--text); }
    .bar-pct   { color: var(--muted); font-variant-numeric: tabular-nums; }

    .bar-track {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* ── Stats strip ── */
    .stats-strip {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px;
    }

    .stat-value {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── Leaflet overrides ── */
    .leaflet-container { background: #0d1020; }

    .leaflet-popup-content-wrapper {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.82rem;
    }

    .leaflet-popup-tip { background: var(--surface); }

    .leaflet-control-zoom a {
      background: var(--surface) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    .leaflet-control-zoom a:hover {
      background: var(--border) !important;
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      #map-wrap { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      #sidebar  { max-height: 40vh; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
<div id="app">

  <header>
    <h1>County <span>Durham</span> Election Results</h1>
    <span class="year-tag">2024</span>
    <span class="header-note">Durham County Council · May 2024 · 51 wards</span>
  </header>

  <div id="map-wrap">
    <div id="map"></div>

    <aside id="sidebar">

      <!-- Legend -->
      <div class="sidebar-section">
        <div class="section-label">Winning Party</div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:var(--reform)"></div>
          <span>Reform UK</span>
          <span class="legend-count" id="count-reform">—</span>
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:var(--libdem)"></div>
          <span>Liberal Democrats</span>
          <span class="legend-count" id="count-libdem">—</span>
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:var(--indep)"></div>
          <span>Independent</span>
          <span class="legend-count" id="count-indep">—</span>
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:var(--labour)"></div>
          <span>Labour</span>
          <span class="legend-count" id="count-labour">—</span>
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:var(--green)"></div>
          <span>Green</span>
          <span class="legend-count" id="count-green">—</span>
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:var(--tory)"></div>
          <span>Conservative</span>
          <span class="legend-count" id="count-tory">—</span>
        </div>
      </div>

      <!-- Ward detail -->
      <div id="ward-info" class="sidebar-section">
        <div id="ward-placeholder">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
          </svg>
          <p>Click a ward on the map to see the full results breakdown</p>
        </div>

        <div id="ward-detail">
          <div class="ward-name" id="detail-name"></div>
          <div class="ward-meta" id="detail-meta"></div>
          <div class="winner-badge" id="detail-winner"></div>
          <div class="section-label" style="margin-top:4px">Vote Share</div>
          <div id="detail-bars"></div>
          <div class="stats-strip">
            <div class="stat-box">
              <div class="stat-value" id="detail-turnout"></div>
              <div class="stat-label">Turnout</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="detail-votes"></div>
              <div class="stat-label">Votes Cast</div>
            </div>
          </div>
        </div>
      </div>

    </aside>
  </div>
</div>

<script>
// ── Party config ──────────────────────────────────────────────
const PARTIES = [
  { key: 'reform_uk',      label: 'Reform UK',          color: '#12b5b5' },
  { key: 'labour',         label: 'Labour',             color: '#e4003b' },
  { key: 'libdem',         label: 'Liberal Democrats',  color: '#f5a623' },
  { key: 'conservative',   label: 'Conservative',       color: '#003f8f' },
  { key: 'green',          label: 'Green',              color: '#4caf50' },
  { key: 'independent',    label: 'Independent',        color: '#9e9e9e' },
  { key: 'other',          label: 'Other',              color: '#7b68ee' },
];

const WINNER_COLOR = {
  'Reform UK':            '#12b5b5',
  'Labour Party':         '#e4003b',
  'Liberal Democrats':    '#f5a623',
  'The Conservative Party':'#003f8f',
  'The Green Party':      '#4caf50',
  'Independent':          '#9e9e9e',
  'Other':                '#7b68ee',
};

function partyColor(name) {
  return WINNER_COLOR[name] || '#7b68ee';
}

// ── Map setup ─────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true, attributionControl: true });

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_matter/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// ── Load GeoJSON ──────────────────────────────────────────────
let geojsonLayer;
let counts = {};

fetch('data/2024.geojson')
  .then(r => {
    if (!r.ok) throw new Error('Could not load data/2024.geojson');
    return r.json();
  })
  .then(data => {
    // Count winners for legend
    data.features.forEach(f => {
      const w = f.properties.winning_party;
      counts[w] = (counts[w] || 0) + 1;
    });
    updateLegendCounts(counts);

    geojsonLayer = L.geoJSON(data, {
      style: feature => ({
        fillColor:   partyColor(feature.properties.winning_party),
        fillOpacity: 0.65,
        color:       '#0f1117',
        weight:      1.2,
      }),
      onEachFeature: (feature, layer) => {
        layer.on({
          mouseover(e) {
            e.target.setStyle({ fillOpacity: 0.9, weight: 2.5, color: '#fff' });
            e.target.bringToFront();
          },
          mouseout(e) {
            geojsonLayer.resetStyle(e.target);
          },
          click(e) {
            showWardDetail(feature.properties);
            map.fitBounds(e.target.getBounds(), { padding: [40, 40] });
          }
        });
      }
    }).addTo(map);

    map.fitBounds(geojsonLayer.getBounds(), { padding: [20, 20] });
  })
  .catch(err => {
    console.error(err);
    document.getElementById('ward-placeholder').innerHTML =
      '<p style="color:#e4003b">⚠ Could not load GeoJSON.<br>Make sure <code>data/2024.geojson</code> exists in your repo.</p>';
  });

// ── Legend counts ─────────────────────────────────────────────
function updateLegendCounts(c) {
  const map = {
    'Reform UK':             'reform',
    'Liberal Democrats':     'libdem',
    'Independent':           'indep',
    'Labour Party':          'labour',
    'The Green Party':       'green',
    'The Conservative Party':'tory',
  };
  Object.entries(map).forEach(([party, id]) => {
    const el = document.getElementById('count-' + id);
    if (el) el.textContent = (c[party] || 0) + ' ward' + (c[party] === 1 ? '' : 's');
  });
}

// ── Ward detail panel ─────────────────────────────────────────
function showWardDetail(p) {
  document.getElementById('ward-placeholder').style.display = 'none';
  const detail = document.getElementById('ward-detail');
  detail.style.display = 'block';

  document.getElementById('detail-name').textContent = p.WD25NM;
  document.getElementById('detail-meta').textContent = 'County Durham · 2024 Council Election';

  const winnerEl = document.getElementById('detail-winner');
  winnerEl.textContent = p.winning_party;
  winnerEl.style.background = partyColor(p.winning_party);

  // Vote share bars — sort by votes descending
  const barsEl = document.getElementById('detail-bars');
  barsEl.innerHTML = '';

  const rows = PARTIES
    .map(pt => ({ label: pt.label, pct: p[pt.key + '_pct'] || 0, color: pt.color }))
    .filter(r => r.pct > 0)
    .sort((a, b) => b.pct - a.pct);

  rows.forEach(r => {
    barsEl.innerHTML += `
      <div class="bar-row">
        <div class="bar-label-row">
          <span class="bar-party">${r.label}</span>
          <span class="bar-pct">${r.pct}%</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${r.pct}%; background:${r.color}"></div>
        </div>
      </div>`;
  });

  document.getElementById('detail-votes').textContent =
    (p.total_votes || 0).toLocaleString();

  // Turnout isn't stored in properties — show votes cast only
  document.getElementById('detail-turnout').textContent = '—';
}
</script>
</body>
</html>
