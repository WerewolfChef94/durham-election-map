<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>County Durham — Election History</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #181c27;
      --surface2: #1f2436;
      --border:   #2a2f40;
      --text:     #e8e6e0;
      --muted:    #7a8099;
      --accent:   #c8a96e;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Source Sans 3', sans-serif; font-weight: 300; }

    #app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }

    /* ── Header ── */
    header {
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem; font-weight: 900; letter-spacing: -0.02em;
    }
    header h1 span { color: var(--accent); }

    /* ── Controls ── */
    #controls {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    }

    .toggle-wrap {
      display: flex; align-items: center;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden;
    }
    .toggle-btn {
      padding: 7px 18px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      border: none; cursor: pointer;
      background: transparent; color: var(--muted);
      transition: background 0.2s, color 0.2s;
    }
    .toggle-btn.active { background: var(--accent); color: #0f1117; }

    .timeline-wrap {
      flex: 1; display: flex; flex-direction: column;
      gap: 4px; padding: 0 8px; min-width: 260px;
    }
    .timeline-top { display: flex; align-items: center; gap: 12px; }
    .year-label {
      font-size: 0.65rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); white-space: nowrap;
    }
    .year-display {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 48px;
    }
    .boundary-note { font-size: 0.7rem; color: var(--muted); font-style: italic; margin-left: auto; }

    .slider-outer {
      position: relative; height: 48px; display: flex; align-items: center;
    }
    .slider-track {
      position: absolute; left: 0; right: 0; height: 3px;
      background: var(--border); border-radius: 2px; pointer-events: none;
    }
    .slider-fill {
      position: absolute; left: 0; height: 3px;
      background: var(--accent); border-radius: 2px;
      pointer-events: none; transition: width 0.1s;
    }
    .slider-ticks {
      position: absolute; left: 0; right: 0;
      display: flex; justify-content: space-between;
      pointer-events: none;
    }
    .slider-tick { position: relative; display: flex; flex-direction: column; align-items: center; }
    .tick-mark { width: 2px; height: 10px; background: var(--border); border-radius: 1px; }
    .tick-mark.active { background: var(--accent); }
    .tick-label {
      font-size: 0.72rem; font-weight: 600; color: var(--muted);
      margin-top: 4px; white-space: nowrap; letter-spacing: 0.03em;
    }
    .tick-label.active { color: var(--accent); font-weight: 700; font-size: 0.78rem; }
    #year-slider {
      position: absolute; left: 0; right: 0; width: 100%;
      opacity: 0; cursor: pointer; height: 48px; margin: 0;
      -webkit-appearance: none; z-index: 2;
    }

    /* ── Map + sidebar ── */
    #map-wrap { display: grid; grid-template-columns: 1fr 300px; overflow: hidden; }
    #map { background: #0d1020; }

    #sidebar {
      background: var(--surface); border-left: 1px solid var(--border);
      overflow-y: auto; display: flex; flex-direction: column;
    }

    .sidebar-section { padding: 18px 18px 0; }
    .sidebar-section + .sidebar-section {
      border-top: 1px solid var(--border); margin-top: 16px; padding-top: 16px;
    }
    .section-label {
      font-size: 0.65rem; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 12px;
    }

    .legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.8rem; }
    .legend-swatch { width: 13px; height: 13px; border-radius: 2px; flex-shrink: 0; }
    .legend-count { margin-left: auto; font-size: 0.7rem; color: var(--muted); }

    #area-info { flex: 1; padding: 18px; }
    #area-placeholder {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 10px;
      color: var(--muted); text-align: center; font-size: 0.8rem; padding: 30px;
    }
    #area-placeholder svg { opacity: 0.2; margin-bottom: 4px; }
    #area-detail { display: none; }

    .area-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem; font-weight: 700; margin-bottom: 3px; line-height: 1.2;
    }
    .area-meta { font-size: 0.73rem; color: var(--muted); margin-bottom: 14px; }
    .winner-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 11px; border-radius: 3px;
      font-size: 0.78rem; font-weight: 600; margin-bottom: 6px; color: #fff;
    }
    .mp-name { font-size: 0.75rem; color: var(--muted); margin-bottom: 14px; }

    .bar-row { margin-bottom: 9px; }
    .bar-label-row { display: flex; justify-content: space-between; font-size: 0.73rem; margin-bottom: 3px; }
    .bar-party { color: var(--text); }
    .bar-pct { color: var(--muted); font-variant-numeric: tabular-nums; }
    .bar-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

    .stats-strip {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border);
    }
    .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 9px; }
    .stat-value { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.65rem; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.08em; }

    /* ── Swing section ── */
    .swing-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 16px; margin-bottom: 8px;
    }
    .swing-compare-wrap {
      display: flex; align-items: center; gap: 6px;
    }
    .swing-compare-label {
      font-size: 0.65rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    #swing-year-select {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 3px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.72rem; padding: 3px 6px; cursor: pointer;
    }
    #swing-year-select:focus { outline: none; border-color: var(--accent); }

    .swing-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 7px; font-size: 0.75rem;
    }
    .swing-party { flex: 1; color: var(--text); }
    .swing-value {
      font-variant-numeric: tabular-nums;
      font-weight: 600; min-width: 52px; text-align: right;
    }
    .swing-value.up   { color: #4caf50; }
    .swing-value.down { color: #e4003b; }
    .swing-value.flat { color: var(--muted); }
    .swing-bar-wrap {
      width: 60px; height: 6px; background: var(--border);
      border-radius: 3px; overflow: hidden; flex-shrink: 0;
    }
    .swing-bar-fill {
      height: 100%; border-radius: 3px;
    }
    .swing-none {
      font-size: 0.75rem; color: var(--muted); font-style: italic;
    }
    .swing-warning {
      font-size: 0.72rem; color: #f5a623;
      background: rgba(245,166,35,0.1);
      border: 1px solid rgba(245,166,35,0.3);
      border-radius: 3px; padding: 6px 8px;
      margin-bottom: 10px; line-height: 1.4;
    }

    /* ── Deprivation sidebar ── */
    #depr-sidebar {
      border-top: 1px solid var(--border);
      padding: 16px 18px;
      display: none;
    }
    #depr-sidebar.visible { display: block; }

    .depr-domain-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 7px; font-size: 0.75rem;
    }
    .depr-domain-name { flex: 1; color: var(--text); }
    .depr-decile-bar-wrap {
      width: 80px; height: 8px;
      background: var(--border); border-radius: 3px; overflow: hidden;
    }
    .depr-decile-bar { height: 100%; border-radius: 3px; }
    .depr-decile-val {
      font-variant-numeric: tabular-nums;
      font-weight: 600; font-size: 0.72rem;
      min-width: 28px; text-align: right; color: var(--accent);
    }
    .depr-no-data { font-size: 0.75rem; color: var(--muted); font-style: italic; }

    /* ── Deprivation overlay ── */
    #deprivation-controls {
      position: absolute;
      top: 0; left: 0; right: 0;
      background: rgba(24,28,39,0.92);
      border-bottom: 1px solid var(--border);
      padding: 2px 24px;
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      font-size: 0.7rem;
      height: 28px;
      overflow: hidden;
      z-index: 1000;
    }
    #deprivation-controls.visible { display: flex; }

    .depr-toggle {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.78rem; color: var(--text); cursor: pointer;
    }
    .depr-toggle input[type=checkbox] { cursor: pointer; accent-color: var(--accent); }

    .depr-label {
      font-size: 0.6rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); white-space: nowrap;
    }
    #depr-domain-select, #depr-year-select {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 3px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.7rem; padding: 2px 5px; cursor: pointer;
    }
    #depr-domain-select:focus, #depr-year-select:focus {
      outline: none; border-color: var(--accent);
    }

    .depr-legend {
      display: flex; align-items: center; gap: 4px;
      margin-left: auto;
    }
    .depr-legend-label {
      font-size: 0.6rem; color: var(--muted); white-space: nowrap;
    }
    .depr-swatch {
      width: 12px; height: 6px; border-radius: 1px;
    }
    .depr-legend-end { font-size: 0.6rem; color: var(--muted); white-space: nowrap; }

    .leaflet-container { background: #0d1020; }
    .leaflet-popup-content-wrapper {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      font-family: 'Source Sans 3', sans-serif; font-size: 0.8rem;
    }
    .leaflet-popup-tip { background: var(--surface); }
    .leaflet-control-zoom a { background: var(--surface) !important; color: var(--text) !important; border-color: var(--border) !important; }
    .leaflet-control-zoom a:hover { background: var(--border) !important; }

    .area-tooltip {
      background: var(--surface) !important; border: 1px solid var(--border) !important;
      border-radius: 4px !important; color: var(--text) !important;
      font-family: 'Source Sans 3', sans-serif !important;
      font-size: 0.8rem !important; padding: 6px 10px !important;
      box-shadow: 0 3px 12px rgba(0,0,0,0.5) !important;
    }
    .area-tooltip strong { display: block; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
    .area-tooltip::before { display: none !important; }

    @media (max-width: 700px) {
      #map-wrap { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      #sidebar { max-height: 40vh; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
<div id="app">

  <header>
    <h1>County <span>Durham</span> Election History</h1>
  </header>

  <div id="controls">
    <div class="toggle-wrap">
      <button class="toggle-btn active" id="btn-ge"        onclick="setMode('ge')">General</button>
      <button class="toggle-btn"        id="btn-local"     onclick="setMode('local')">Local</button>
      <button class="toggle-btn"        id="btn-byElection" onclick="setMode('byElection')">By-Elections</button>
    </div>
    <div class="timeline-wrap">
      <div class="timeline-top">
        <span class="year-label">Year</span>
        <span class="year-display" id="year-display">2024</span>
        <span class="boundary-note" id="boundary-note"></span>
      </div>
      <div class="slider-outer">
        <div class="slider-track"></div>
        <div class="slider-fill" id="slider-fill"></div>
        <div class="slider-ticks" id="slider-ticks"></div>
        <input type="range" id="year-slider" min="0" step="1" value="0"
               oninput="onSliderInput(this.value)" onchange="onSliderChange(this.value)">
      </div>
    </div>
  </div>


  <div id="map-outer" style="position:relative;overflow:hidden;height:100%">
  <div id="deprivation-controls">
    <label class="depr-toggle">
      <input type="checkbox" id="depr-visible" onchange="toggleDeprivation()">
      Deprivation
    </label>
    <span class="depr-label">Year</span>
    <select id="depr-year-select" onchange="updateDeprivation()">
      <option value="2004">2004</option>
      <option value="2007">2007</option>
      <option value="2015">2015</option>
      <option value="2019">2019</option>
      <option value="2025" selected>2025</option>
    </select>
    <span class="depr-label">Domain</span>
    <select id="depr-domain-select" onchange="updateDeprivation()">
      <option value="imd">Overall IMD</option>
      <option value="income">Income</option>
      <option value="employment">Employment</option>
      <option value="health">Health</option>
      <option value="education">Education</option>
      <option value="crime">Crime</option>
      <option value="barriers">Barriers to Housing</option>
      <option value="living_env">Living Environment</option>
    </select>
    <div class="depr-legend">
      <span class="depr-legend-label">Most deprived</span>
      <div style="display:flex;gap:1px;align-items:center">
        <div class="depr-swatch" style="background:#67000d"></div>
        <div class="depr-swatch" style="background:#cb181d"></div>
        <div class="depr-swatch" style="background:#fb6a4a"></div>
        <div class="depr-swatch" style="background:#fcbba1"></div>
        <div class="depr-swatch" style="background:#fff5f0"></div>
        <div class="depr-swatch" style="background:#ffffff;border:1px solid #444"></div>
      </div>
      <span class="depr-legend-end">Least</span>
    </div>
  </div>

  <div id="map-wrap">
    <div id="map"></div>
    <aside id="sidebar">
      <div class="sidebar-section">
        <div class="section-label">Winning Party</div>
        <div id="legend-items"></div>
      </div>
      <div id="area-info" class="sidebar-section">
        <div id="area-placeholder">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
          </svg>
          <p>Click an area on the map to see the full results breakdown</p>
        </div>
        <div id="area-detail">
          <div class="area-name" id="detail-name"></div>
          <div class="area-meta" id="detail-meta"></div>
          <div class="winner-badge" id="detail-winner"></div>
          <div class="mp-name" id="detail-mp"></div>
          <div class="section-label" style="margin-top:4px">Vote Share</div>
          <div id="detail-bars"></div>

          <div class="swing-header">
            <div class="section-label" style="margin:0">Swing vs</div>
            <div class="swing-compare-wrap">
              <select id="swing-year-select" onchange="updateSwing()">
                <option value="">— select year —</option>
              </select>
            </div>
          </div>
          <div id="detail-swing"></div>
          <div class="stats-strip">
            <div class="stat-box">
              <div class="stat-value" id="detail-turnout"></div>
              <div class="stat-label">Turnout</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="detail-votes"></div>
              <div class="stat-label">Votes Cast</div>
            </div>
          </div>
        </div>
        </div>

      <div id="depr-sidebar">
        <div class="section-label">Deprivation (<span id="depr-sidebar-year">—</span>)</div>
        <div id="depr-sidebar-content"></div>
      </div>

    </aside>
  </div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────
// Boundary eras — years sharing the same boundaries
const BOUNDARY_ERAS = {
  ge: [
    { years: ['1997','2001','2005'],           label: '1997 boundaries' },
    { years: ['2010','2015','2017','2019'],     label: '2010 boundaries' },
    { years: ['2024'],                          label: '2024 boundaries (redrawn)' },
  ],
  local: [
    { years: ['2008','2013','2017','2021'],     label: '2008–2023 ward boundaries' },
    { years: ['2024'],                          label: '2024 ward boundaries (redrawn)' },
  ],
  byElection: [
    { years: ['2017','2019','2022','2023','2024','2025','2026'], label: 'Various boundaries' },
  ],
};

function sameBoundaryEra(mode, yearA, yearB) {
  const eras = BOUNDARY_ERAS[mode] || [];
  return eras.some(era => era.years.includes(yearA) && era.years.includes(yearB));
}

function getBoundaryLabel(mode, year) {
  const eras = BOUNDARY_ERAS[mode] || [];
  const era = eras.find(e => e.years.includes(year));
  return era ? era.label : '';
}
const MODES = {
  ge: {
    label: 'General Election',
    years: ['1997','2001','2005','2010','2015','2017','2019','2024'],
    files: {
      '1997':'data/ge_1997.geojson','2001':'data/ge_1997.geojson','2005':'data/ge_1997.geojson',
      '2010':'data/ge_2010.geojson','2015':'data/ge_2010.geojson',
      '2017':'data/ge_2010.geojson','2019':'data/ge_2010.geojson',
      '2024':'data/ge_2024.geojson',
    },
    boundaryNotes: {
      '1997':'1997–2005 boundaries','2001':'1997–2005 boundaries','2005':'1997–2005 boundaries',
      '2010':'2010–2019 boundaries','2015':'2010–2019 boundaries',
      '2017':'2010–2019 boundaries','2019':'2010–2019 boundaries',
      '2024':'2024 boundaries (redrawn)',
    },
    nameFields: { 'data/ge_1997.geojson':'name', 'data/ge_2010.geojson':'name', 'data/ge_2024.geojson':'PCON24NM' },
    parties: [
      { key:'lab', label:'Labour',           color:'#e4003b' },
      { key:'con', label:'Conservative',     color:'#003f8f' },
      { key:'lib', label:'Liberal Democrats',color:'#f5a623' },
      { key:'ruk', label:'Reform UK',        color:'#12b5b5' },
      { key:'grn', label:'Green',            color:'#4caf50' },
      { key:'oth', label:'Other',            color:'#7b68ee' },
    ],
  },
  byElection: {
    label: 'By-Election',
    years: ['2017','2019','2022','2023','2024','2025','2026'],
    files: {
      '2017':'data/by_elections.geojson',
      '2019':'data/by_elections.geojson',
      '2022':'data/by_elections.geojson',
      '2023':'data/by_elections.geojson',
      '2024':'data/by_elections.geojson',
      '2025':'data/by_elections.geojson',
      '2026':'data/by_elections.geojson',
    },
    boundaryNotes: {
      '2017':'By-elections held in 2017',
      '2019':'By-elections held in 2019',
      '2022':'By-elections held in 2022',
      '2023':'By-elections held in 2023',
      '2024':'By-elections held in 2024',
      '2025':'By-elections held in 2025',
      '2026':'By-elections held in 2026',
    },
    nameFields: { 'data/by_elections.geojson':'ward' },
    parties: [
      { key:'labour',           label:'Labour',            color:'#e4003b' },
      { key:'conservative',     label:'Conservative',      color:'#003f8f' },
      { key:'liberal_democrats',label:'Liberal Democrats', color:'#f5a623' },
      { key:'reform_uk',        label:'Reform UK',         color:'#12b5b5' },
      { key:'green',            label:'Green',             color:'#4caf50' },
      { key:'independent',      label:'Independent',       color:'#9e9e9e' },
      { key:'other',            label:'Other',             color:'#7b68ee' },
    ],
  },
  local: {
    label: 'Local Election',
    years: ['2005','2008','2013','2017','2021','2024'],
    files: {
      '2005':'data/local_2011era.geojson',
      '2008':'data/local_2011era.geojson',
      '2013':'data/local_2011era.geojson',
      '2017':'data/local_2011era.geojson',
      '2021':'data/local_2011era.geojson',
      '2024':'data/local_2024.geojson',
    },
    boundaryNotes: {
      '2005':'2008–2024 ward boundaries',
      '2008':'2008–2024 ward boundaries',
      '2013':'2008–2024 ward boundaries',
      '2017':'2008–2024 ward boundaries',
      '2021':'2008–2024 ward boundaries',
      '2024':'2024 ward boundaries (redrawn)',
    },
    nameFields: {
      'data/local_2011era.geojson':'wd11nm',
      'data/local_2024.geojson':'WD25NM',
    },
    parties: [
      { key:'reform_uk',    label:'Reform UK',         color:'#12b5b5' },
      { key:'labour',       label:'Labour',            color:'#e4003b' },
      { key:'libdem',       label:'Liberal Democrats', color:'#f5a623' },
      { key:'conservative', label:'Conservative',      color:'#003f8f' },
      { key:'green',        label:'Green',             color:'#4caf50' },
      { key:'independent',  label:'Independent',       color:'#9e9e9e' },
      { key:'other',        label:'Other',             color:'#7b68ee' },
    ],
  },
};

const PARTY_COLORS = {
  'Lab':'#e4003b','Labour':'#e4003b','Labour Party':'#e4003b',
  'Con':'#003f8f','Conservative':'#003f8f','The Conservative Party':'#003f8f',
  'Lib':'#f5a623','LD':'#f5a623','Liberal Democrats':'#f5a623',
  'RUK':'#12b5b5','Reform UK':'#12b5b5',
  'Green':'#4caf50','The Green Party':'#4caf50',
  'Independent':'#9e9e9e',
  'Oth':'#7b68ee','Other':'#7b68ee',
};
const partyColor = n => PARTY_COLORS[n] || '#7b68ee';

// ── State ─────────────────────────────────────────────────────
let currentMode = 'ge';
let currentYear = '2024';
let geojsonLayer = null;
let geoCache = {};

// ── Map init ──────────────────────────────────────────────────
const map = L.map('map', {
  zoomControl: true,
  zoomSnap: 0.25,        // snap to quarter zoom levels
  zoomDelta: 0.5,        // each +/- button moves half a zoom level
  wheelPxPerZoomLevel: 120, // smoother mouse wheel (higher = slower)
  scrollWheelZoom: true,
});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_matter/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

// ── Timeline slider ───────────────────────────────────────────
function buildTimeline() {
  const years = MODES[currentMode].years;
  const slider = document.getElementById('year-slider');
  const ticks  = document.getElementById('slider-ticks');
  const fill   = document.getElementById('slider-fill');

  slider.max   = years.length - 1;
  const idx    = Math.max(0, years.indexOf(currentYear));
  slider.value = idx;

  // Ticks
  ticks.innerHTML = '';
  years.forEach((yr, i) => {
    const active = yr === currentYear;
    const tick = document.createElement('div');
    tick.className = 'slider-tick';
    tick.innerHTML = `<div class="tick-mark ${active ? 'active' : ''}"></div>
                      <div class="tick-label ${active ? 'active' : ''}">${yr}</div>`;
    ticks.appendChild(tick);
  });

  // Fill bar
  const pct = years.length > 1 ? (idx / (years.length - 1)) * 100 : 0;
  fill.style.width = pct + '%';

  document.getElementById('year-display').textContent = currentYear;
}

function onSliderInput(val) {
  // Live preview while dragging — update display and fill only
  const years = MODES[currentMode].years;
  const yr = years[parseInt(val)];
  const pct = years.length > 1 ? (val / (years.length - 1)) * 100 : 0;
  document.getElementById('slider-fill').style.width = pct + '%';
  document.getElementById('year-display').textContent = yr;
  // Update tick highlights
  document.querySelectorAll('.tick-mark').forEach((t,i) => t.classList.toggle('active', i == val));
  document.querySelectorAll('.tick-label').forEach((t,i) => t.classList.toggle('active', i == val));
}

function onSliderChange(val) {
  // Snap and load on release
  const years = MODES[currentMode].years;
  setYear(years[parseInt(val)]);
}

// ── Legend ────────────────────────────────────────────────────
function buildLegend(features) {
  const counts = {};
  features.forEach(f => {
    const winner = currentMode === 'ge'
      ? (f.properties.results?.[currentYear]?.winning_party)
      : f.properties.winning_party;
    if (winner) counts[winner] = (counts[winner]||0) + 1;
  });

  const el = document.getElementById('legend-items');
  el.innerHTML = '';
  MODES[currentMode].parties.forEach(pt => {
    const aliases = {
      lab:['Lab','Labour','Labour Party'], con:['Con','Conservative','The Conservative Party'],
      lib:['Lib','LD','Liberal Democrats'], ruk:['RUK','Reform UK'],
      grn:['Green','The Green Party'], oth:['Oth','Other'],
      reform_uk:['Reform UK'], labour:['Labour','Labour Party'],
      libdem:['LD','Liberal Democrats'], conservative:['Conservative','The Conservative Party'],
      green:['Green','The Green Party'], independent:['Independent'], other:['Other'],
    };
    const count = (aliases[pt.key]||[pt.label]).reduce((s,k)=>s+(counts[k]||0),0);
    if (!count) return;
    const div = document.createElement('div');
    div.className = 'legend-item';
    div.innerHTML = `<div class="legend-swatch" style="background:${pt.color}"></div>
      <span>${pt.label}</span><span class="legend-count">${count}</span>`;
    el.appendChild(div);
  });
}

// ── Context layer (surrounding areas) ────────────────────────
let contextLayer = null;

fetch('data/context_layer.geojson')
  .then(r => r.json())
  .then(data => {
    contextLayer = L.geoJSON(data, {
      style: {
        fillColor:   '#2a2f40',
        fillOpacity: 0.5,
        color:       '#1a1f2e',
        weight:      0.8,
      },
      onEachFeature: (feature, layer) => {
        layer.bindTooltip(feature.properties.name, {
          sticky: true,
          opacity: 0.85,
          className: 'area-tooltip',
        });
      }
    }).addTo(map);
    // Send context layer to back so main layer renders on top
    contextLayer.bringToBack();
  })
  .catch(err => console.warn('Context layer not loaded:', err));

// ── Load & render ─────────────────────────────────────────────
function loadLayer() {
  const conf = MODES[currentMode];
  const file = conf.files[currentYear];
  if (!file) return;

  document.getElementById('boundary-note').textContent = conf.boundaryNotes[currentYear]||'';
  document.getElementById('area-placeholder').style.display = 'flex';
  document.getElementById('area-detail').style.display = 'none';

  const render = data => {
    if (geojsonLayer) map.removeLayer(geojsonLayer);
    buildLegend(data.features);

    const nameField = conf.nameFields[file] || 'name';

    geojsonLayer = L.geoJSON(data, {
      style: f => {
        const lp = f.properties;
        // For by-elections, only show wards matching the current year
        if (currentMode === 'byElection') {
          const yr = lp.date ? lp.date.substring(0,4) : '';
          if (yr !== currentYear) return { fillOpacity:0, color:'transparent', weight:0 };
        }
        const winner = currentMode === 'ge'
          ? lp.results?.[currentYear]?.winning_party
          : (lp.results?.[currentYear]?.winning_party || lp.winning_party);
        return {
          fillColor: winner ? partyColor(winner) : '#333',
          fillOpacity: 0.65, color: '#0f1117', weight: 1.5,
        };
      },
      onEachFeature: (feature, layer) => {
        const p = feature.properties;
        const name = p[nameField] || '';
        // For by-elections, hide wards not in current year
        if (currentMode === 'byElection') {
          const yr = p.date ? p.date.substring(0,4) : '';
          if (yr !== currentYear) { layer.unbindTooltip(); return; }
        }
        const winner = currentMode === 'ge'
          ? (p.results?.[currentYear]?.winning_party || '—')
          : (p.results?.[currentYear]?.winning_party || p.winning_party || '—');

        layer.bindTooltip(
          `<strong>${name}</strong><br>${winner}`,
          { sticky: true, opacity: 0.95, className: 'area-tooltip' }
        );
        layer.on({
          mouseover(e) { e.target.setStyle({ fillOpacity:0.9, weight:2.5, color:'#fff' }); e.target.bringToFront(); },
          mouseout(e)  { geojsonLayer.resetStyle(e.target); },
          click(e)     { showDetail(feature.properties, nameField); map.fitBounds(e.target.getBounds(), { padding:[40,40] }); }
        });
      }
    }).addTo(map);
    map.fitBounds(geojsonLayer.getBounds(), { padding:[20,20] });
    if (contextLayer) contextLayer.bringToBack();
    // Re-apply muting if deprivation layer is active
    const deprVisible = document.getElementById('depr-visible');
    if (deprVisible && deprVisible.checked) {
      setTimeout(toggleDeprivation, 100);
    }
  };

  if (geoCache[file]) { render(geoCache[file]); return; }
  fetch(file)
    .then(r => { if (!r.ok) throw new Error(file); return r.json(); })
    .then(d => { geoCache[file] = d; render(d); })
    .catch(err => {
      document.getElementById('area-placeholder').innerHTML =
        `<p style="color:#e4003b">⚠ Could not load ${err.message}.<br>Check the file exists in your data/ folder.</p>`;
    });
}

// ── Detail panel ──────────────────────────────────────────────
function showDetail(p, nameField) {
  document.getElementById('area-placeholder').style.display = 'none';
  document.getElementById('area-detail').style.display = 'block';
  lastClickedProps = p;
  lastClickedNameField = nameField;
  populateSwingSelector();
  document.getElementById('detail-swing').innerHTML = '';
  if (document.getElementById('swing-year-select'))
    document.getElementById('swing-year-select').value = '';

  const name = p[nameField] || '';
  document.getElementById('detail-name').textContent = name;
  const metaDate = currentMode === 'byElection' && p.display_date
    ? p.display_date : currentYear;
  document.getElementById('detail-meta').textContent =
    `County Durham · ${MODES[currentMode].label} · ${metaDate}`;

  // Show deprivation data if layer is loaded
  hideDeprivationSidebar();
  if (deprivationData) {
    const deprYr = document.getElementById('depr-year-select').value;
    // Find LSOA(s) that overlap this area by checking centre point
    const lat = p.LAT || p.lat || null;
    const lng = p.LONG || p.long || null;
    if (lat && lng) {
      const lsoa = findLsoaAtLatLng({lat, lng});
      if (lsoa) showDeprivationSidebar(lsoa.properties, deprYr);
    }
  }

  let winner, totalVotes, turnout, mpName;

  if (currentMode === 'ge') {
    const r = p.results?.[currentYear];
    if (!r) { document.getElementById('detail-winner').textContent = 'No data'; return; }
    winner = r.winning_party; totalVotes = r.total_votes;
    turnout = r.turnout; mpName = (r.mp_name && r.mp_name !== '0' && r.mp_name !== 'NaN') ? r.mp_name : '';
  } else {
    // Local 2024 has flat properties; 2011era has results[yr] structure
    const localR = p.results?.[currentYear];
    if (localR) {
      winner = localR.winning_party; totalVotes = localR.total_votes;
      turnout = localR.turnout > 0 ? localR.turnout / 100 : null;
      mpName = localR.winning_candidate || '';
    } else {
      winner = p.winning_party; totalVotes = p.total_votes;
      turnout = p.turnout_pct ? p.turnout_pct / 100 : null;
      mpName = p.winning_candidate || '';
    }
  }

  const winEl = document.getElementById('detail-winner');
  winEl.textContent = winner; winEl.style.background = partyColor(winner);
  const mpLabel = currentMode === 'ge' ? 'MP' : 'Councillor';
  document.getElementById('detail-mp').textContent = mpName ? `${mpLabel}: ${mpName}` : '';

  const barsEl = document.getElementById('detail-bars');
  barsEl.innerHTML = '';
  const localR2 = currentMode === 'local' ? (p.results?.[currentYear] || p) : null;
  const rows = MODES[currentMode].parties.map(pt => {
    let votes, pct;
    if (currentMode === 'ge') {
      const src = p.results?.[currentYear];
      votes = src ? (src[pt.key+'_votes'] || 0) : 0;
      pct   = src ? (src[pt.key+'_pct']   || 0) : 0;
    } else if (currentMode === 'byElection') {
      votes = p[pt.key+'_votes'] || 0;
      pct   = p[pt.key+'_pct']   || 0;
    } else {
      const src = localR2;
      votes = src ? (src[pt.key+'_votes'] || 0) : 0;
      pct   = src ? (src[pt.key+'_pct']   || 0) : 0;
    }
    return { label:pt.label, color:pt.color, votes, pct };
  }).filter(r => r.votes > 0).sort((a,b) => b.votes - a.votes);

  rows.forEach(r => {
    barsEl.innerHTML += `
      <div class="bar-row">
        <div class="bar-label-row">
          <span class="bar-party">${r.label}</span>
          <span class="bar-pct">${r.votes.toLocaleString()} <span style="color:var(--muted)">(${r.pct}%)</span></span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${r.pct}%;background:${r.color}"></div></div>
      </div>`;
  });

  const t = turnout;
  document.getElementById('detail-turnout').textContent =
    t ? ((t < 1 ? t*100 : t).toFixed(1) + '%') : '—';
  document.getElementById('detail-votes').textContent =
    totalVotes ? Number(totalVotes).toLocaleString() : '—';
}

// ── Mode / year switches ──────────────────────────────────────
function setMode(mode) {
  currentMode = mode;
  const years = MODES[mode].years;

  // Find the closest year in the new mode to the current year
  const currentNum = parseInt(currentYear);
  let closest = years[years.length - 1];
  let minDiff = Infinity;
  years.forEach(yr => {
    const diff = Math.abs(parseInt(yr) - currentNum);
    if (diff < minDiff) { minDiff = diff; closest = yr; }
  });
  currentYear = closest;

  document.getElementById('btn-ge').classList.toggle('active', mode==='ge');
  document.getElementById('btn-local').classList.toggle('active', mode==='local');
  document.getElementById('btn-byElection').classList.toggle('active', mode==='byElection');
  // Show deprivation controls for local and by-election modes
  document.getElementById('deprivation-controls').classList.toggle('visible', mode !== 'ge');
  buildTimeline();
  loadLayer();
}

function setYear(yr) {
  currentYear = yr;
  buildTimeline();
  loadLayer();
}

// ── Swing ────────────────────────────────────────────────────
let lastClickedProps = null;
let lastClickedNameField = null;

function populateSwingSelector() {
  const sel = document.getElementById('swing-year-select');
  if (!sel) return;
  sel.innerHTML = '<option value="">— select year —</option>';

  const years = MODES[currentMode].years;
  years.forEach(yr => {
    if (yr !== currentYear) {
      const compatible = sameBoundaryEra(currentMode, currentYear, yr);
      const opt = document.createElement('option');
      opt.value = yr;
      opt.textContent = compatible ? yr : yr + ' ⚠';
      opt.style.color = compatible ? '' : '#f5a623';
      sel.appendChild(opt);
    }
  });
}

function updateSwing() {
  if (!lastClickedProps) return;
  const sel = document.getElementById('swing-year-select');
  const compareYear = sel ? sel.value : '';
  renderSwing(lastClickedProps, compareYear);
}

function renderSwing(p, compareYear) {
  const el = document.getElementById('detail-swing');
  if (!el) return;

  if (!compareYear) {
    el.innerHTML = '';
    return;
  }

  // Get current year party pcts
  const parties = MODES[currentMode].parties;

  function getPcts(yr) {
    if (currentMode === 'ge') {
      // First try nested results on current feature (same boundary era)
      if (p.results?.[yr]) {
        const r = p.results[yr];
        return Object.fromEntries(parties.map(pt => [pt.key, r[pt.key+'_pct'] || 0]));
      }
      // Cross-era: look up by name in the cached file for that year
      const compareFile = MODES[currentMode].files[yr];
      if (!compareFile || !geoCache[compareFile]) return null;
      const compareNameField = MODES[currentMode].nameFields[compareFile];
      const wardName = p[lastClickedNameField] || '';
      // Try exact name match first
      let match = geoCache[compareFile].features.find(f =>
        f.properties[compareNameField] === wardName ||
        f.properties['name'] === wardName
      );
      if (!match) return null;
      if (match.properties.results?.[yr]) {
        const r = match.properties.results[yr];
        return Object.fromEntries(parties.map(pt => [pt.key, r[pt.key+'_pct'] || 0]));
      }
      return null;
    } else if (currentMode === 'byElection') {
      if (yr !== currentYear) return null;
      return Object.fromEntries(parties.map(pt => [pt.key, p[pt.key+'_pct'] || 0]));
    } else {
      // Local: try p.results[yr] first (2011era nested structure)
      if (p.results?.[yr]) {
        const r = p.results[yr];
        return Object.fromEntries(parties.map(pt => [pt.key, r[pt.key+'_pct'] || 0]));
      }
      // Fallback: if this IS the current year and props are flat (2024 local)
      if (yr === currentYear) {
        return Object.fromEntries(parties.map(pt => [pt.key, p[pt.key+'_pct'] || 0]));
      }
      // Cross-era: look up the ward in the cached geojson for that year
      const compareFile = MODES[currentMode].files[yr];
      if (!compareFile || !geoCache[compareFile]) return null;
      const compareNameField = MODES[currentMode].nameFields[compareFile];
      const wardName = p[lastClickedNameField] || p['WD25NM'] || p['wd11nm'] || '';
      const match = geoCache[compareFile].features.find(f =>
        f.properties[compareNameField] === wardName
      );
      if (!match) return null;
      const mp = match.properties;
      // Check nested results first
      if (mp.results?.[yr]) {
        const r = mp.results[yr];
        return Object.fromEntries(parties.map(pt => [pt.key, r[pt.key+'_pct'] || 0]));
      }
      // Flat properties
      return Object.fromEntries(parties.map(pt => [pt.key, mp[pt.key+'_pct'] || 0]));
    }
  }

  const current = getPcts(currentYear);
  const compare = getPcts(compareYear);

  if (!current || !compare) {
    el.innerHTML = '<div class="swing-none">No comparison data available for that year</div>';
    return;
  }

  // Boundary warning
  const compatible = sameBoundaryEra(currentMode, currentYear, compareYear);
  const warning = compatible ? '' : `
    <div class="swing-warning">
      ⚠ Boundaries changed between ${compareYear} and ${currentYear}.
      These areas may not be directly comparable.
    </div>`;

  // Calculate swings
  const swings = parties.map(pt => ({
    label: pt.label,
    color: pt.color,
    current: current[pt.key] || 0,
    compare: compare[pt.key] || 0,
    diff: (current[pt.key] || 0) - (compare[pt.key] || 0),
  }))
  .filter(s => s.current > 0 || s.compare > 0)
  .sort((a, b) => b.current - a.current);

  const maxAbs = Math.max(...swings.map(s => Math.abs(s.diff)), 1);

  el.innerHTML = warning + swings.map(s => {
    const cls   = s.diff > 0.5 ? 'up' : s.diff < -0.5 ? 'down' : 'flat';
    const arrow = s.diff > 0.5 ? '▲' : s.diff < -0.5 ? '▼' : '►';
    const pct   = (s.diff > 0 ? '+' : '') + s.diff.toFixed(1) + '%';
    const barW  = Math.round(Math.abs(s.diff) / maxAbs * 100);
    const barColor = s.diff > 0 ? '#4caf50' : s.diff < 0 ? '#e4003b' : '#555';
    return `
      <div class="swing-row">
        <span class="swing-party">${s.label}</span>
        <div class="swing-bar-wrap">
          <div class="swing-bar-fill" style="width:${barW}%;background:${barColor}"></div>
        </div>
        <span class="swing-value ${cls}">${arrow} ${pct}</span>
      </div>`;
  }).join('');
}

// ── Preload all GeoJSON files into cache ──────────────────────
function preloadAllFiles() {
  const allFiles = new Set();
  Object.values(MODES).forEach(mode => {
    Object.values(mode.files).forEach(f => allFiles.add(f));
  });
  allFiles.forEach(file => {
    if (!geoCache[file]) {
      fetch(file)
        .then(r => r.ok ? r.json() : null)
        .then(data => { if (data) geoCache[file] = data; })
        .catch(() => {});
    }
  });
}

// ── Deprivation overlay ──────────────────────────────────────
const DECILE_COLORS = {
  1: '#67000d', 2: '#a50f15', 3: '#cb181d', 4: '#ef3b2c', 5: '#fb6a4a',
  6: '#fc9272', 7: '#fcbba1', 8: '#fee0d2', 9: '#fff5f0', 10: '#ffffff',
};

let deprivationLayer = null;
let deprivationData = null;

function loadDeprivationData(callback) {
  if (deprivationData) { callback(deprivationData); return; }
  fetch('data/lsoa_deprivation.geojson')
    .then(r => r.json())
    .then(d => { deprivationData = d; callback(d); })
    .catch(err => console.warn('Deprivation layer not loaded:', err));
}

function toggleDeprivation() {
  const visible = document.getElementById('depr-visible').checked;
  if (!visible) {
    if (deprivationLayer) { map.removeLayer(deprivationLayer); deprivationLayer = null; }
    // Restore ward colours to full opacity
    if (geojsonLayer) {
      geojsonLayer.setStyle(feat => {
        const lp = feat.properties;
        const winner = currentMode === 'ge'
          ? lp.results?.[currentYear]?.winning_party
          : (lp.results?.[currentYear]?.winning_party || lp.winning_party);
        return {
          fillColor: winner ? partyColor(winner) : '#333',
          fillOpacity: 0.65, color: '#0f1117', weight: 1.5,
        };
      });
    }
    return;
  }
  // Fully hide ward colours when deprivation is visible
  if (geojsonLayer) {
    geojsonLayer.setStyle({
      fillOpacity: 0,
      color: 'rgba(255,255,255,0.3)',
      weight: 0.5,
    });
  }
  updateDeprivation();
}

function updateDeprivation() {
  const visible = document.getElementById('depr-visible').checked;
  if (!visible) return;
  // Refresh sidebar if it's currently showing
  hideDeprivationSidebar();

  const yr     = document.getElementById('depr-year-select').value;
  const domain = document.getElementById('depr-domain-select').value;
  const key    = domain + '_decile';

  loadDeprivationData(data => {
    if (deprivationLayer) map.removeLayer(deprivationLayer);

    deprivationLayer = L.geoJSON(data, {
      style: feat => {
        const d = feat.properties.data?.[yr];
        const decile = d ? d[key] : null;
        return {
          fillColor:   decile ? DECILE_COLORS[decile] : 'transparent',
          fillOpacity: decile ? 0.65 : 0,
          color:       '#0f1117',
          weight:      0.5,
        };
      },
      onEachFeature: (feat, layer) => {
        const p = feat.properties;
        const d = p.data?.[yr];
        const decile = d ? d[key] : null;
        const domainLabel = document.getElementById('depr-domain-select')
          .options[document.getElementById('depr-domain-select').selectedIndex].text;
        const tip = decile
          ? `<strong>${p.lsoa_name}</strong><br>${domainLabel}: Decile ${decile}/10`
          : `<strong>${p.lsoa_name}</strong><br>No data for ${yr}`;
        layer.bindTooltip(tip, { sticky: true, opacity: 0.95, className: 'area-tooltip' });
        layer.on('click', () => {
          showDeprivationSidebar(p, yr);
        });
      }
    }).addTo(map);

    // Keep context layer at back, deprivation above context but below ward layer
    if (contextLayer) contextLayer.bringToBack();
    deprivationLayer.bringToBack();
    if (contextLayer) contextLayer.bringToBack();
  });
}

// ── Deprivation sidebar ──────────────────────────────────────
const DOMAIN_LABELS = {
  imd:        'Overall IMD',
  income:     'Income',
  employment: 'Employment',
  health:     'Health',
  education:  'Education',
  crime:      'Crime',
  barriers:   'Barriers to Housing',
  living_env: 'Living Environment',
};

function showDeprivationSidebar(lsoaProps, yr) {
  const sidebar = document.getElementById('depr-sidebar');
  const content = document.getElementById('depr-sidebar-content');
  const yearEl  = document.getElementById('depr-sidebar-year');

  const data = lsoaProps?.data?.[yr];
  if (!data) {
    sidebar.classList.remove('visible');
    return;
  }

  yearEl.textContent = yr;
  sidebar.classList.add('visible');

  content.innerHTML = Object.entries(DOMAIN_LABELS).map(([key, label]) => {
    const decile = data[key + '_decile'];
    if (!decile) return '';
    // Color based on decile — red for most deprived
    const pct   = Math.round((decile / 10) * 100);
    const red   = Math.round(255 - (decile - 1) * 22);
    const green = Math.round((decile - 1) * 22);
    const color = `rgb(${red},${green},60)`;
    return `
      <div class="depr-domain-row">
        <span class="depr-domain-name">${label}</span>
        <div class="depr-decile-bar-wrap">
          <div class="depr-decile-bar" style="width:${pct}%;background:${color}"></div>
        </div>
        <span class="depr-decile-val">${decile}/10</span>
      </div>`;
  }).join('');
}

function hideDeprivationSidebar() {
  document.getElementById('depr-sidebar').classList.remove('visible');
}

function findLsoaAtLatLng(latlng) {
  if (!deprivationData) return null;
  // Simple point-in-polygon check
  const pt = [latlng.lng, latlng.lat];
  for (const feat of deprivationData.features) {
    if (pointInGeoJSON(pt, feat.geometry)) return feat;
  }
  return null;
}

function pointInGeoJSON(pt, geom) {
  if (geom.type === 'Polygon') return pointInPolygon(pt, geom.coordinates[0]);
  if (geom.type === 'MultiPolygon') {
    return geom.coordinates.some(poly => pointInPolygon(pt, poly[0]));
  }
  return false;
}

function pointInPolygon(pt, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    if (((yi > pt[1]) !== (yj > pt[1])) &&
        (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}
