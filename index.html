<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>County Durham â€” Election History</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #181c27;
      --surface2: #1f2436;
      --border:   #2a2f40;
      --text:     #e8e6e0;
      --muted:    #7a8099;
      --accent:   #c8a96e;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Source Sans 3', sans-serif; font-weight: 300; }

    #app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }

    /* â”€â”€ Header â”€â”€ */
    header {
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem; font-weight: 900; letter-spacing: -0.02em;
    }
    header h1 span { color: var(--accent); }

    /* â”€â”€ Controls â”€â”€ */
    #controls {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    }

    .toggle-wrap {
      display: flex; align-items: center;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden;
    }
    .toggle-btn {
      padding: 7px 18px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      border: none; cursor: pointer;
      background: transparent; color: var(--muted);
      transition: background 0.2s, color 0.2s;
    }
    .toggle-btn.active { background: var(--accent); color: #0f1117; }

    .year-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .year-label {
      font-size: 0.65rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); margin-right: 4px;
    }
    .year-btn {
      padding: 5px 12px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.75rem; font-weight: 600;
      border: 1px solid var(--border); border-radius: 20px;
      cursor: pointer; background: transparent; color: var(--muted);
      transition: all 0.2s;
    }
    .year-btn:hover { border-color: var(--accent); color: var(--text); }
    .year-btn.active { background: var(--accent); border-color: var(--accent); color: #0f1117; }

    .boundary-note { margin-left: auto; font-size: 0.7rem; color: var(--muted); font-style: italic; }

    /* â”€â”€ Map + sidebar â”€â”€ */
    #map-wrap { display: grid; grid-template-columns: 1fr 300px; overflow: hidden; }
    #map { background: #0d1020; }

    #sidebar {
      background: var(--surface); border-left: 1px solid var(--border);
      overflow-y: auto; display: flex; flex-direction: column;
    }

    .sidebar-section { padding: 18px 18px 0; }
    .sidebar-section + .sidebar-section {
      border-top: 1px solid var(--border); margin-top: 16px; padding-top: 16px;
    }
    .section-label {
      font-size: 0.65rem; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 12px;
    }

    .legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.8rem; }
    .legend-swatch { width: 13px; height: 13px; border-radius: 2px; flex-shrink: 0; }
    .legend-count { margin-left: auto; font-size: 0.7rem; color: var(--muted); }

    #area-info { flex: 1; padding: 18px; }
    #area-placeholder {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 10px;
      color: var(--muted); text-align: center; font-size: 0.8rem; padding: 30px;
    }
    #area-placeholder svg { opacity: 0.2; margin-bottom: 4px; }
    #area-detail { display: none; }

    .area-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem; font-weight: 700; margin-bottom: 3px; line-height: 1.2;
    }
    .area-meta { font-size: 0.73rem; color: var(--muted); margin-bottom: 14px; }
    .winner-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 11px; border-radius: 3px;
      font-size: 0.78rem; font-weight: 600; margin-bottom: 6px; color: #fff;
    }
    .mp-name { font-size: 0.75rem; color: var(--muted); margin-bottom: 14px; }

    .bar-row { margin-bottom: 9px; }
    .bar-label-row { display: flex; justify-content: space-between; font-size: 0.73rem; margin-bottom: 3px; }
    .bar-party { color: var(--text); }
    .bar-pct { color: var(--muted); font-variant-numeric: tabular-nums; }
    .bar-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

    .stats-strip {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border);
    }
    .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 9px; }
    .stat-value { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.65rem; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.08em; }

    .leaflet-container { background: #0d1020; }
    .leaflet-popup-content-wrapper {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      font-family: 'Source Sans 3', sans-serif; font-size: 0.8rem;
    }
    .leaflet-popup-tip { background: var(--surface); }
    .leaflet-control-zoom a { background: var(--surface) !important; color: var(--text) !important; border-color: var(--border) !important; }
    .leaflet-control-zoom a:hover { background: var(--border) !important; }

    .area-tooltip {
      background: var(--surface) !important; border: 1px solid var(--border) !important;
      border-radius: 4px !important; color: var(--text) !important;
      font-family: 'Source Sans 3', sans-serif !important;
      font-size: 0.8rem !important; padding: 6px 10px !important;
      box-shadow: 0 3px 12px rgba(0,0,0,0.5) !important;
    }
    .area-tooltip strong { display: block; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
    .area-tooltip::before { display: none !important; }

    @media (max-width: 700px) {
      #map-wrap { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      #sidebar { max-height: 40vh; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
<div id="app">

  <header>
    <h1>County <span>Durham</span> Election History</h1>
  </header>

  <div id="controls">
    <div class="toggle-wrap">
      <button class="toggle-btn active" id="btn-ge"    onclick="setMode('ge')">General</button>
      <button class="toggle-btn"        id="btn-local" onclick="setMode('local')">Local</button>
    </div>
    <div class="year-wrap">
      <span class="year-label">Year</span>
      <div id="year-pills"></div>
    </div>
    <span class="boundary-note" id="boundary-note"></span>
  </div>

  <div id="map-wrap">
    <div id="map"></div>
    <aside id="sidebar">
      <div class="sidebar-section">
        <div class="section-label">Winning Party</div>
        <div id="legend-items"></div>
      </div>
      <div id="area-info" class="sidebar-section">
        <div id="area-placeholder">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
          </svg>
          <p>Click an area on the map to see the full results breakdown</p>
        </div>
        <div id="area-detail">
          <div class="area-name" id="detail-name"></div>
          <div class="area-meta" id="detail-meta"></div>
          <div class="winner-badge" id="detail-winner"></div>
          <div class="mp-name" id="detail-mp"></div>
          <div class="section-label" style="margin-top:4px">Vote Share</div>
          <div id="detail-bars"></div>
          <div class="stats-strip">
            <div class="stat-box">
              <div class="stat-value" id="detail-turnout"></div>
              <div class="stat-label">Turnout</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="detail-votes"></div>
              <div class="stat-label">Votes Cast</div>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>

<script>
// â”€â”€ Config â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const MODES = {
  ge: {
    label: 'General Election',
    years: ['1997','2001','2005','2010','2015','2017','2019','2024'],
    files: {
      '1997':'data/ge_1997.geojson','2001':'data/ge_1997.geojson','2005':'data/ge_1997.geojson',
      '2010':'data/ge_2010.geojson','2015':'data/ge_2010.geojson',
      '2017':'data/ge_2010.geojson','2019':'data/ge_2010.geojson',
      '2024':'data/ge_2024.geojson',
    },
    boundaryNotes: {
      '1997':'1997â€“2005 boundaries','2001':'1997â€“2005 boundaries','2005':'1997â€“2005 boundaries',
      '2010':'2010â€“2019 boundaries','2015':'2010â€“2019 boundaries',
      '2017':'2010â€“2019 boundaries','2019':'2010â€“2019 boundaries',
      '2024':'2024 boundaries (redrawn)',
    },
    nameFields: { 'data/ge_1997.geojson':'name', 'data/ge_2010.geojson':'name', 'data/ge_2024.geojson':'PCON24NM' },
    parties: [
      { key:'lab', label:'Labour',           color:'#e4003b' },
      { key:'con', label:'Conservative',     color:'#003f8f' },
      { key:'lib', label:'Liberal Democrats',color:'#f5a623' },
      { key:'ruk', label:'Reform UK',        color:'#12b5b5' },
      { key:'grn', label:'Green',            color:'#4caf50' },
      { key:'oth', label:'Other',            color:'#7b68ee' },
    ],
  },
  local: {
    label: 'Local Election',
    years: ['2024'],
    files: { '2024':'data/local_2024.geojson' },
    boundaryNotes: { '2024':'2024 ward boundaries' },
    nameFields: { 'data/local_2024.geojson':'WD25NM' },
    parties: [
      { key:'reform_uk',    label:'Reform UK',         color:'#12b5b5' },
      { key:'labour',       label:'Labour',            color:'#e4003b' },
      { key:'libdem',       label:'Liberal Democrats', color:'#f5a623' },
      { key:'conservative', label:'Conservative',      color:'#003f8f' },
      { key:'green',        label:'Green',             color:'#4caf50' },
      { key:'independent',  label:'Independent',       color:'#9e9e9e' },
      { key:'other',        label:'Other',             color:'#7b68ee' },
    ],
  },
};

const PARTY_COLORS = {
  'Lab':'#e4003b','Labour':'#e4003b','Labour Party':'#e4003b',
  'Con':'#003f8f','Conservative':'#003f8f','The Conservative Party':'#003f8f',
  'Lib':'#f5a623','LD':'#f5a623','Liberal Democrats':'#f5a623',
  'RUK':'#12b5b5','Reform UK':'#12b5b5',
  'Green':'#4caf50','The Green Party':'#4caf50',
  'Independent':'#9e9e9e',
  'Oth':'#7b68ee','Other':'#7b68ee',
};
const partyColor = n => PARTY_COLORS[n] || '#7b68ee';

// â”€â”€ State â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let currentMode = 'ge';
let currentYear = '2024';
let geojsonLayer = null;
let geoCache = {};

// â”€â”€ Map init â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const map = L.map('map', { zoomControl: true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_matter/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

// â”€â”€ Year pills â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function buildYearPills() {
  const wrap = document.getElementById('year-pills');
  wrap.innerHTML = '';
  MODES[currentMode].years.forEach(yr => {
    const btn = document.createElement('button');
    btn.className = 'year-btn' + (yr === currentYear ? ' active' : '');
    btn.textContent = yr;
    btn.onclick = () => setYear(yr);
    wrap.appendChild(btn);
  });
}

// â”€â”€ Legend â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function buildLegend(features) {
  const counts = {};
  features.forEach(f => {
    const winner = currentMode === 'ge'
      ? (f.properties.results?.[currentYear]?.winning_party)
      : f.properties.winning_party;
    if (winner) counts[winner] = (counts[winner]||0) + 1;
  });

  const el = document.getElementById('legend-items');
  el.innerHTML = '';
  MODES[currentMode].parties.forEach(pt => {
    const aliases = {
      lab:['Lab','Labour','Labour Party'], con:['Con','Conservative','The Conservative Party'],
      lib:['Lib','LD','Liberal Democrats'], ruk:['RUK','Reform UK'],
      grn:['Green','The Green Party'], oth:['Oth','Other'],
      reform_uk:['Reform UK'], labour:['Labour','Labour Party'],
      libdem:['LD','Liberal Democrats'], conservative:['Conservative','The Conservative Party'],
      green:['Green','The Green Party'], independent:['Independent'], other:['Other'],
    };
    const count = (aliases[pt.key]||[pt.label]).reduce((s,k)=>s+(counts[k]||0),0);
    if (!count) return;
    const div = document.createElement('div');
    div.className = 'legend-item';
    div.innerHTML = `<div class="legend-swatch" style="background:${pt.color}"></div>
      <span>${pt.label}</span><span class="legend-count">${count}</span>`;
    el.appendChild(div);
  });
}

// â”€â”€ Load & render â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function loadLayer() {
  const conf = MODES[currentMode];
  const file = conf.files[currentYear];
  if (!file) return;

  document.getElementById('boundary-note').textContent = conf.boundaryNotes[currentYear]||'';
  document.getElementById('area-placeholder').style.display = 'flex';
  document.getElementById('area-detail').style.display = 'none';

  const render = data => {
    if (geojsonLayer) map.removeLayer(geojsonLayer);
    buildLegend(data.features);

    const nameField = conf.nameFields[file] || 'name';

    geojsonLayer = L.geoJSON(data, {
      style: f => {
        const winner = currentMode === 'ge'
          ? f.properties.results?.[currentYear]?.winning_party
          : f.properties.winning_party;
        return {
          fillColor: winner ? partyColor(winner) : '#333',
          fillOpacity: 0.65, color: '#0f1117', weight: 1.5,
        };
      },
      onEachFeature: (feature, layer) => {
        const p = feature.properties;
        const name = p[nameField] || '';
        const winner = currentMode === 'ge'
          ? (p.results?.[currentYear]?.winning_party || 'â€”')
          : (p.winning_party || 'â€”');

        layer.bindTooltip(
          `<strong>${name}</strong><br>${winner}`,
          { sticky: true, opacity: 0.95, className: 'area-tooltip' }
        );
        layer.on({
          mouseover(e) { e.target.setStyle({ fillOpacity:0.9, weight:2.5, color:'#fff' }); e.target.bringToFront(); },
          mouseout(e)  { geojsonLayer.resetStyle(e.target); },
          click(e)     { showDetail(feature.properties, nameField); map.fitBounds(e.target.getBounds(), { padding:[40,40] }); }
        });
      }
    }).addTo(map);
    map.fitBounds(geojsonLayer.getBounds(), { padding:[20,20] });
  };

  if (geoCache[file]) { render(geoCache[file]); return; }
  fetch(file)
    .then(r => { if (!r.ok) throw new Error(file); return r.json(); })
    .then(d => { geoCache[file] = d; render(d); })
    .catch(err => {
      document.getElementById('area-placeholder').innerHTML =
        `<p style="color:#e4003b">âš  Could not load ${err.message}.<br>Check the file exists in your data/ folder.</p>`;
    });
}

// â”€â”€ Detail panel â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function showDetail(p, nameField) {
  document.getElementById('area-placeholder').style.display = 'none';
  document.getElementById('area-detail').style.display = 'block';

  const name = p[nameField] || '';
  document.getElementById('detail-name').textContent = name;
  document.getElementById('detail-meta').textContent =
    `County Durham Â· ${MODES[currentMode].label} ${currentYear}`;

  let winner, totalVotes, turnout, mpName;

  if (currentMode === 'ge') {
    const r = p.results?.[currentYear];
    if (!r) { document.getElementById('detail-winner').textContent = 'No data'; return; }
    winner = r.winning_party; totalVotes = r.total_votes;
    turnout = r.turnout; mpName = r.mp_name || '';
  } else {
    winner = p.winning_party; totalVotes = p.total_votes;
    turnout = p.turnout_pct ? p.turnout_pct / 100 : null; mpName = '';
  }

  const winEl = document.getElementById('detail-winner');
  winEl.textContent = winner; winEl.style.background = partyColor(winner);
  document.getElementById('detail-mp').textContent = mpName ? `MP: ${mpName}` : '';

  const barsEl = document.getElementById('detail-bars');
  barsEl.innerHTML = '';
  const rows = MODES[currentMode].parties.map(pt => {
    const votes = currentMode === 'ge'
      ? (p.results?.[currentYear]?.[pt.key+'_votes'] || 0)
      : (p[pt.key+'_votes'] || 0);
    const pct = currentMode === 'ge'
      ? (p.results?.[currentYear]?.[pt.key+'_pct'] || 0)
      : (p[pt.key+'_pct'] || 0);
    return { label:pt.label, color:pt.color, votes, pct };
  }).filter(r => r.votes > 0).sort((a,b) => b.votes - a.votes);

  rows.forEach(r => {
    barsEl.innerHTML += `
      <div class="bar-row">
        <div class="bar-label-row">
          <span class="bar-party">${r.label}</span>
          <span class="bar-pct">${r.votes.toLocaleString()} <span style="color:var(--muted)">(${r.pct}%)</span></span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${r.pct}%;background:${r.color}"></div></div>
      </div>`;
  });

  const t = turnout;
  document.getElementById('detail-turnout').textContent =
    t ? ((t < 1 ? t*100 : t).toFixed(1) + '%') : 'â€”';
  document.getElementById('detail-votes').textContent =
    totalVotes ? Number(totalVotes).toLocaleString() : 'â€”';
}

// â”€â”€ Mode / year switches â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function setMode(mode) {
  currentMode = mode;
  const years = MODES[mode].years;
  currentYear = years[years.length - 1];
  document.getElementById('btn-ge').classList.toggle('active', mode==='ge');
  document.getElementById('btn-local').classList.toggle('active', mode==='local');
  buildYearPills();
  loadLayer();
}

function setYear(yr) {
  currentYear = yr;
  document.querySelectorAll('.year-btn').forEach(b =>
    b.classList.toggle('active', b.textContent === yr));
  loadLayer();
}
